<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
<link href="http://fonts.googleapis.com/icon?family=Material+Icons"
	rel="stylesheet">
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script type="text/javascript" src="https://code.jquery.com/jquery-2.1.1.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
<!-- Compiled and minified JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.6.1/css/font-awesome.min.css">
<link href='https://fonts.googleapis.com/css?family=Open+Sans:300' rel='stylesheet' type='text/css'>
<link href='css/style.css' rel='stylesheet' type='text/css'>
<link rel="stylesheet" th:href="@{/css/sellect.css}">

<script src="../static/js/sellect.js" th:src="@{/js/sellect.js}"></script>
<script src="../static/js/register.js" th:src="@{/js/register.js}"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
<title>Account</title>
<style>
.tabs .indicator {
	background-color: #0d47a1;
}

body {
	align-items: center;
		align-items: center;
	 background-image: url('images/ingredient_op.png');
  	background-repeat: no-repeat;
  	background-attachment: fixed;  
  	background-size: cover;
	
}
</style>
</head>
<body>
<header>
		<div class="navbar-fixed" id="centerNav" >
			<nav style="height:160px; background-color:white;" class="fixed" id="centerNav">
				<div class="nav-wrapper" id="centerNav">
					<!-- <a th:href="@{/}" class="brand-logo"><img class="logo"
					src="/images/logo.png" /></a> -->
					<ul style="width: 100%" id="centerNav"
						class="hide-on-med-and-down">
						<li><a id="landNav" href="/users/userHome">Mama's Dish</a></li>
					
					</ul>
				</div>
			</nav>
		</div>
	</header>

	<div class="row container padtop80" style="margin-top:70px">
		<div class="col m6 offset-m3 s12">
			<div class="row">
				<div class="col s12">
					<ul class="tabs">
						<li class="tab col s3"><a href="#test1"
							class="active blue-text text-darken-4">Register</a></li>
					</ul>
				</div>
			</div>
		</div>
		<div class="col m6 offset-m3 s12 z-depth-1"  id="formLogin">
		<form th:action="@{/register}" method="post">
			
				<p id="errId" style="text-align:center" th:text="${errMssg}"></p>
			
				<div class="input-field col s12 ">
					<input placeholder="Email Address" th:value="${emailInput}" id="email" type="text" name="email" class="validate" required> 
						<label for="email">Email ID* </label>
				</div>
				<div class="input-field col s12 ">
					<input placeholder="First Name" id="first_name" th:value="${fNameInput}" type="text" name="fname" class="validate" required>
					 <label for="first_name">First Name* </label>
				</div>
				<div class="input-field col s12 ">
					<input placeholder="Last Name" id="last_name"  th:value="${lNameInput}"  type="text" name="lname" class="validate" required> 
					<label for="last_name">Last Name* </label>
				</div>
				<div class="input-field col s12 ">
					<input placeholder="Password" id="password1" type="password" required name="password" class="validate">
					<label for="password1">Password*</label>
				</div>
				
				<div class="input-field col s12 ">
					<input placeholder="Password" id="password2" type="password" required name="password2" class="validate"> 
					<label for="password2">Re-enter Password*</label>
				</div>
				<div class="input-field col s12 ">
					<label>Select Preferences:</label><br><br>
				</div>
				<div class="input-field col s12">
					<label>Country</label><br>
				</div>
					
				<div class="input-field col s12">
					   <input type="text" id="my-country">
						<div id="selected-country" class="demo-list selected-list"></div>
				</div>
				
				<div class="input-field col s12" style="display:none">
					   <input type="text" id="country" >
						<div id="selected-country" class="demo-list selected-list"></div>
				</div>
				
				
				<div class="input-field col s12">
					<label>Cuisine</label><br>
				</div>
					
				<div class="input-field col s12">
					   <input type="text" id="my-cuisine">
						<div id="selected-cuisine" class="demo-list selected-list"></div>
				</div>
				

				<div class="input-field col s12">
					<label>Diet</label><br>
				</div>
					
				<div class="input-field col s12">
					   <input type="text" id="my-diet">
						<div id="selected-diet" class="demo-list selected-list"></div>
				</div>

				<div class="input-field col s12">
					<label>Protein</label><br>
				</div>
					
				<div class="input-field col s12">
					   <input type="text" id="my-protein">
						<div id="selected-protein" class="demo-list selected-list"></div>
				</div>
			
				
				<p style="padding-left:10px;">
					<input type="checkbox" name="isChef" id="test6" onClick="showDescription(this)" /> 
						<label for="test6">Sign up as a CHEF </label>
				</p>
				
				<div class="input-field col s12 " id="descriptionBox" style="display: none">
					<label>Tell us about yourself: </label>
					<textarea name="description"  class="materialize-textarea"></textarea>					
				</div>
				
				<p id="loginBtn" >
					<input type="submit" value="Register"  class="blue darken-4 btn"/>
				</p>
				 </form>
				 </div>
				 </div>
				
			<script th:inline="javascript">
							var listProtein = [];
							var proteins = /*[[${proteins}]]*/{};
							proteins.forEach(element=>
								listProtein.push(element.proteinType)
							);
						  
							var listDiet = [];
							var diets = /*[[${diets}]]*/{};
							diets.forEach(element=>
								listDiet.push(element.dietType)
							);
							
							var listCuisine = [];
							var cuisines = /*[[${cuisines}]]*/{};
							cuisines.forEach(element=>
								listCuisine.push(element.cuisineName)
							);
						
							var listCountry = [];
							var countries = /*[[${countries}]]*/{};
							countries.forEach(element=>
								listCountry.push(element.name)
							);
						</script>
</body>


</html>
