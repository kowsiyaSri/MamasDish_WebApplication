<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
<link href="http://fonts.googleapis.com/icon?family=Material+Icons"
	rel="stylesheet">
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/materialize/0.97.7/css/materialize.min.css">
<link rel="stylesheet"
	href="https://maxcdn.bootstrapcdn.com/font-awesome/4.6.1/css/font-awesome.min.css">
<link href='https://fonts.googleapis.com/css?family=Open+Sans:300'
	rel='stylesheet' type='text/css'>
<link href='css/style.css' rel='stylesheet' type='text/css'>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
<title>Account</title>
<style>
.tabs .indicator {
	background-color: #0d47a1;
}

body {
	align-items: center;
}
</style>
</head>
<body>


	<div class="row container padtop80" style="min-height: 100vh">
		<div class="col m6 offset-m3 s12">
			<div class="row">
				<div class="col s12">
					<ul class="tabs">
						<li class="tab col s3"><a href="#test1"
							class="active blue-text text-darken-4">Register</a></li>
					</ul>
				</div>
			</div>
		</div>
		<div class="col m6 offset-m3 s12 z-depth-1 padtop10">
		<form th:action="@{/register}" method="post">
			
				<div class="input-field col s12 ">
					<input placeholder="Email Address" id="email" type="text"
						name="email" class="validate"> <label for="email">Email
						ID* </label>
				</div>
				<div class="input-field col s12 ">
					<input placeholder="First Name" id="first_name" type="text"
						name="fname" class="validate"> <label for="first_name">First
						Name* </label>
				</div>
				<div class="input-field col s12 ">
					<input placeholder="Last Name" id="last_name" type="text"
						name="lname" class="validate"> <label for="last_name">Last
						Name* </label>
				</div>
				<div class="input-field col s12 ">
					<input placeholder="Password" id="password1" type="password"
						name="password" class="validate"> <label for="password1">Password*</label>
				</div>


				<p class="padleft10">
					<input type="checkbox" name="isChef" id="test6" onClick="showDescription(this)" /> <label
						for="test6">Sign up as a CHEF </label>
				</p>
				<div class="input-field col s12 " id="descriptionBox" style="display: none">
					<label>Description</label> <br> <br> 
					<input type="text" name="description" >					
				</div>
				<p class="padleft10">
					<input type="submit" value="Register" class="blue darken-4 btn" style="margin:20px;">
				</p>
			
		</form>
		</div>





		<script type="text/javascript"
			src="https://code.jquery.com/jquery-2.1.1.min.js"></script>
		<script
			src="https://cdnjs.cloudflare.com/ajax/libs/materialize/0.97.8/js/materialize.min.js">
			
		</script>
		<script>
			$(document).ready(function() {
				$(".button-collapse").sideNav();
				$(".dropdown-button").dropdown();
				$('select').material_select();
				$('.slider').slider({
					full_width : true
				});
				$(".button-collapse").sideNav();
			})
		</script>
		<script>
			$(document).ready(function() {
				$(".hid").hide();
				$("#hider").click(function() {
					$(".remx").hide();
					$(".hid").show();
				});
				$("#cancll").click(function() {
					$(".remx").show();
					$(".hid").hide();
				})
			});
			
			
			function showDescription(el) {
		       if (el.checked) {
					$("#descriptionBox").css("display", "block")
				}
				else{
					$("#descriptionBox").css("display", "none")
				}}
		</script>
</body>


</html>
