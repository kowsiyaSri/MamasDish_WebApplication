<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="ISO-8859-1">

<script type="text/javascript" src="https://code.jquery.com/jquery-2.1.1.min.js"></script>
<link href="css/home.css" th:href="@{/css/home.css}" rel="stylesheet" type="text/css">
<link href="css/home.css" th:href="@{/css/style.css}" rel="stylesheet" type="text/css">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
<script src="../static/js/script.js" th:src="@{/js/script.js}"></script>
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta http-equiv="content-type" content="text/html; charset=UTF-8">

<title>Suggest Recipes</title>
</head>
<body>

	<div th:replace="fragments/myHeader :: headerTemplate"></div>
	
	<div class="content">
	  <div id="userHomeHeader">Just For You</div>
		  <div class="scrolling-wrapper-flexbox">
				<div class="cardInfo" th:each="s : ${suggest}">
			    <div class="col s3">
			      <div style="border-radius:20px" class="card">
			        <a th:href="@{'/users/viewRecipe/' + ${s.id}}">
				         <div class="card-image">
				          	<img id="userHomeImage" style="border-radius:20px" th:if="${s.recipeImg != null}" th:src="@{'http://ocranp.dev.fast.sheridanc.on.ca/images/recipes/'+ ${s.recipeImg}}">

							<img id="userHomeImage" style="border-radius:20px" th:unless="${s.recipeImg != null}" th:src="@{/images/shakshuka.png}">
				          <span class="card-title"  id="userHomeTitle" th:text="${s.title}"></span>
				        </div>
			        </a>
			      </div>
			    </div>
			  </div>
		 </div>
	 </div>
	<div class="content">
	  <div id="userHomeHeader">Based on your favourite Countries:</div>
		  <div class="scrolling-wrapper-flexbox">
				<div class="cardInfo" th:each="c : ${countries}">
			    <div class="col s3">
			      <div style="border-radius:20px" class="card">
			        <a th:href="@{'/users/viewRecipe/' + ${c.id}}">
				         <div class="card-image">
				          	<img id="userHomeImage" style="border-radius:20px" th:if="${c.recipeImg != null}" th:src="@{'http://ocranp.dev.fast.sheridanc.on.ca/images/recipes/'+ ${c.recipeImg}}">

							<img id="userHomeImage" style="border-radius:20px" th:unless="${c.recipeImg != null}" th:src="@{/images/shakshuka.png}">
				          <span class="card-title"  id="userHomeTitle" th:text="${c.title}"></span>
				        </div>
			        </a>
			      </div>
			    </div>
			  </div>
		 </div>
	 </div>
	 <div class="content">
	  <div id="userHomeHeader">Based on your favourite Cuisines:</div>
		  <div class="scrolling-wrapper-flexbox">

				          <span class="card-title"  id="userHomeTitle" th:text="${c.title}"></span>
				        </div>
			        </a>
			      </div>
			    </div>
			  </div>
		 </div>
	 </div>
	 <div class="content">
	  <div id="userHomeHeader">Based on your favourite Proteins:</div>
		  <div class="scrolling-wrapper-flexbox">
				<div class="cardInfo" th:each="p : ${proteins}">
			    <div class="col s3">
			      <div style="border-radius:20px" class="card">

				          	<img id="userHomeImage" style="border-radius:20px" th:if="${p.recipeImg != null}" th:src="@{'http://ocranp.dev.fast.sheridanc.on.ca/images/recipes/'+ ${p.recipeImg}}">

							<img id="userHomeImage" style="border-radius:20px" th:unless="${p.recipeImg != null}" th:src="@{/images/shakshuka.png}">

			        </a>
			      </div>
			    </div>
			  </div>
		 </div>
	 </div>

	  <div id="userHomeHeader">Based on your favourite diet:</div>
		  <div class="scrolling-wrapper-flexbox">

			      <div style="border-radius:20px" class="card">

				         <div class="card-image">
				          	<img id="userHomeImage" style="border-radius:20px" th:if="${d.recipeImg != null}" th:src="@{'http://ocranp.dev.fast.sheridanc.on.ca/images/recipes/'+ ${d.recipeImg}}">

							<img id="userHomeImage" style="border-radius:20px" th:unless="${d.recipeImg != null}" th:src="@{/images/shakshuka.png}">

</body>
</html>
