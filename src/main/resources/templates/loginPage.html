<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
<link href="http://fonts.googleapis.com/icon?family=Material+Icons"
	rel="stylesheet">
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/materialize/0.97.7/css/materialize.min.css">
<link rel="stylesheet"
	href="https://maxcdn.bootstrapcdn.com/font-awesome/4.6.1/css/font-awesome.min.css">
<link href='https://fonts.googleapis.com/css?family=Open+Sans:300'
	rel='stylesheet' type='text/css'>
<link href='css/style.css' rel='stylesheet' type='text/css'>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
<title>Account</title>
<style>
.tabs .indicator {
	background-color: #0d47a1;
}

body {
	align-items: center;
	 background-image: url('images/ingredient_op.png');
  	background-repeat: no-repeat;
  	background-attachment: fixed;  
  	background-size: cover;
	
}
</style>
</head>
<body>


<header>
		<div class="navbar-fixed" id="centerNav" >
			<nav style="height:160px; background-color:white;" class="fixed" id="centerNav">
				<div class="nav-wrapper" id="centerNav">
					<!-- <a th:href="@{/}" class="brand-logo"><img class="logo"
					src="/images/logo.png" /></a> -->
					<ul style="width: 100%" id="centerNav"
						class="hide-on-med-and-down">
						<li><a id="landNav" href="/viewAllRecipe">Mama's Dish</a></li>
					
					</ul>
				</div>
			</nav>
		</div>
	</header>

	<div class="row container" style="margin-top:70px;">
		<div class="col m6 offset-m3 s12">
			<div class="row">
				<div class="col s12">
					<ul class="tabs">
						<li class="tab col s3"><a href="#test1"
							class="active blue-text text-darken-4">Login</a></li>
					</ul>
				</div>
			</div>
		</div>
		
		<div id="test1" class="col s12">
			<form th:action="@{/login}" method="post" >

				<div class="col m6 offset-m3 s12 z-depth-1" id="formLogin">
					<div class="lid">
						<div th:if="${param.error}">
							<div class="alert ">Invalid username or password.</div>
						</div>
						<div th:if="${param.logout}">
							<div class="alert ">You have been logged out.</div>
						</div>
						<div class="input-field col s12 remx">
							<input placeholder="Email" id="first_name" type="text" required class="validate" name="username"> 
							<label for="first_name">Email</label>
						</div>
						<div class="input-field col s12 remx">
							<input placeholder="Password" id="password1" type="password" required name="password" class="validate">
							 <label for="password1">Password</label>
						</div>		
						
				<p style="padding-left:10px; margin-top:20px">
					<p id="loginBtn">
						<input type="submit" name="login-submit" id="login-submit" value="Login" class=" btn blue darken-4 btn"> 
						
						<br>
						 <p id="noAcct">Don't have an account?<a th:href="@{/register}" id="registerSh">
							Register</a></p>
						</p>
						
					</div>
			</form>	
		</div>
		</div>


		<script type="text/javascript"
			src="https://code.jquery.com/jquery-2.1.1.min.js"></script>
		<script
			src="https://cdnjs.cloudflare.com/ajax/libs/materialize/0.97.8/js/materialize.min.js">
			
		</script>
		<script>
			$(document).ready(function() {
				$(".button-collapse").sideNav();
				$(".dropdown-button").dropdown();
				$('select').material_select();
				$('.slider').slider({
					full_width : true
				});
				$(".button-collapse").sideNav();
			})
		</script>
		<script>
			$(document).ready(function() {
				$(".hid").hide();
				$("#hider").click(function() {
					$(".remx").hide();
					$(".hid").show();
				});
				$("#cancll").click(function() {
					$(".remx").show();
					$(".hid").hide();
				})
			});
		</script>
</body>


</html>
