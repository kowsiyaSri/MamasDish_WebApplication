<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
<meta charset="ISO-8859-1">
<script type="text/javascript" src="https://code.jquery.com/jquery-2.1.1.min.js"></script>
<link href="css/home.css" th:href="@{/css/home.css}" rel="stylesheet" type="text/css">
<link href="css/home.css" th:href="@{/css/style.css}" rel="stylesheet" type="text/css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
<script src="../static/js/script.js" th:src="@{/js/script.js}"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">	
<title>View Profile</title>

</head>
<body>
	<header>
		<div class="navbar-fixed">
			<nav>
			    <div class="nav-wrapper" style="background-color:white">
				      <a th:href="@{/users/userHome}" class="brand-logo" style="color:grey;padding-left:10px;">Mama's Dish</a>
				      <a href="#" data-target="mobile-demo" class="sidenav-trigger"><i class="material-icons cyan-text text-darken-4">menu</i></a>
				      	<ul class="right hide-on-med-and-down">
							<li><a th:href="@{/users/viewAllRecipe}"  id="homeNavTxt">All Recipes</a></li>
							<li><a th:href="@{/users/discover}"  id="homeNavTxt">Discover Recipes</a></li>
							<li><a th:href="@{/chefs/chefIndex}"  id="homeNavTxt">Chef's Portal</a></li>
							<li><a th:href="@{/chefs/uploadRecipe}"  id="homeNavTxt">Upload Recipe</a></li>
							<li><a th:href="@{/viewProfile}"  id="homeNavTxt">Profile</a></li>
		      				<li><a th:href="@{/messages/inbox}" id="homeNavTxt">Inbox<span class="new badge" th:text="${emails}" id="mailCount"></span></a></li>
							<li><a th:href="@{/logout}" id="homeNavTxt">Logout</a></li>
		     	 		</ul>
	    		</div>
	  		</nav>
		</div>
	</header>

	<div class="container" style="margin-top:70px">
		
				 	<h3 id="recipeHeader">View Profile</h3>
		
		<div>
			<form th:action="@{/editProfile}" method="POST">
			
    				<div class="card" style="border-radius:20px">
    					
        					<div class="card-content">
        							 <span class="card-title">Personal Information</span>
        					
								<input type="hidden" id="id" name="id" th:value="${user.id}" />		
								<div class="row">			
								<div class="input-field col s12 ">
									<label for="email">Email ID </label>
									<input  th:value="${user.email}" type="text" readonly> 
								</div>
								</div>
								
								<div class="row">
								<div class="input-field col s12 ">
									<label for="first_name">First Name </label>
									<input id="first_name" th:value="${user.firstName}" type="text" readonly>
								</div>
								</div>
								<div class="row">
								<div class="input-field col s12 ">
									<label for="last_name">Last Name </label>
									<input id="last_name"  th:value="${user.lastName}"  type="text" readonly> 
								</div>
								</div>
					</div>
				</div>
				
				<div class="card" style="border-radius:20px">
    				<div class="card-content">
        				<span class="card-title">Recipe Preferences:</span>
        					
        				<div class="row">
        					<div class="input-field col s12 ">
								<label>Country</label>
								<input th:value="${countries} == '' ? 'Not Selected' : ${countries}"  type="text" readonly> 
							</div>
						</div>
						
						<div class="row">	
							<div class="input-field col s12">
								<label>Cuisine</label>
								<input th:value="${cuisines} == '' ? 'Not Selected' : ${cuisines}"  type="text" readonly> 
							</div>
						</div>
							
					<div class="row">
						<div class="input-field col s12">
							<label>Diet Type</label>
							<input th:value="${diets} == '' ? 'Not Selected' : ${diets}"  type="text" readonly> 
						</div>
					</div>
				
					<div class="row">
						<div class="input-field col s12">
							<label>Protein</label><br>
							<input th:value="${proteins} == '' ? 'Not Selected' : ${proteins}"  type="text" readonly> 
						</div>
					</div>
					
					<div class="row">
						<div th:if="${chef}" class="input-field col s12">
							<label>Chef Profile Description</label><br>
							<textarea id="description"  class="materialize-textarea" th:text=${chef.description} readonly></textarea>		
						</div>
					</div>
					</div>
				</div>
			
			  <button class="btn waves-effect waves-light" style="float: right;background-color:#5085A5; width:100%" type="submit" name="action">
			  		Edit Profile
    			<i class="material-icons right">edit</i>
 			 </button>
			
			
			
		</form>
		</div>
		</div>
</body>
</html>
