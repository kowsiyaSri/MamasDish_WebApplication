<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="ISO-8859-1">
<link href="css/home.css" th:href="@{/css/home.css}" rel="stylesheet" type="text/css">
<link href="css/home.css" th:href="@{/css/style.css}" rel="stylesheet" type="text/css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
<title>Suggest Recipes</title>
</head>
<body>
	<header>
		<div class="navbar-fixed" id="centerNav">
			<nav class="homeNav fixed" id="centerNav">
				<div class="nav-wrapper" id="centerNav">
					<!-- <a th:href="@{/}" class="brand-logo"><img class="logo"
					src="/images/logo.png" /></a> -->
					<ul style="width: 100%" id="centerNav"
						class="hide-on-med-and-down">
						<li style="padding-right: 70px"><a style="padding:0px 30px" th:href="@{/users/userHome}"  id="homeNavTxt">Home</a></li>
						<li style="padding-right: 70px"><a style="padding:0px 30px" th:href="@{/users/viewAllRecipe}"  id="homeNavTxt">All Recipes</a></li>
						<li style="padding-right: 70px"><a style="padding:0px 30px" th:href="@{/users/discover}"  id="homeNavTxt">Discover Recipes</a></li>
						<li style="padding-right: 70px"><a style="padding:0px 30px" th:href="@{/chefs/chefIndex}"  id="homeNavTxt">Chef's Portal</a></li>
						<li style="padding-right: 70px"><a style="padding:0px 30px" th:href="@{/chefs/uploadRecipe}"  id="homeNavTxt">Upload Recipe</a></li>
						<li style="padding-right: 70px"><a style="padding:0px 30px" th:href="@{/viewProfile}"  id="homeNavTxt">Profile</a></li>
						<li><a style="padding:0px 30px" th:href="@{/logout}" id="homeNavTxt">Logout</a></li>
					</ul>
				</div>
			</nav>
		</div>
	</header>
	<div class="content">
	  <div id="userHomeHeader">Just For You</div>
		  <div class="scrolling-wrapper-flexbox">
				<div class="cardInfo" th:each="s : ${suggest}">
			    <div class="col s3">
			      <div style="border-radius:20px" class="card">
			        <a th:href="@{'/users/viewRecipe/' + ${s.id}}">
				         <div class="card-image">
				          	<img id="userHomeImage" style="border-radius:20px" th:if="${s.recipeImg != null}" th:src="@{'/images/recipes/'+ ${s.recipeImg}}">

							<img id="userHomeImage" style="border-radius:20px" th:unless="${s.recipeImg != null}" th:src="@{/images/shakshuka.png}">
				          <span class="card-title"  id="userHomeTitle" th:text="${s.title}"></span>
				        </div>
			        </a>
			      </div>
			    </div>
			  </div>
		 </div>
	 </div>
	<div class="content">
	  <div id="userHomeHeader">Based on your favourite Countries:</div>
		  <div class="scrolling-wrapper-flexbox">
				<div class="cardInfo" th:each="c : ${countries}">
			    <div class="col s3">
			      <div style="border-radius:20px" class="card">
			        <a th:href="@{'/users/viewRecipe/' + ${c.id}}">
				         <div class="card-image">
				          	<img id="userHomeImage" style="border-radius:20px" th:if="${c.recipeImg != null}" th:src="@{'/images/recipes/'+ ${c.recipeImg}}">

							<img id="userHomeImage" style="border-radius:20px" th:unless="${c.recipeImg != null}" th:src="@{/images/shakshuka.png}">
				          <span class="card-title"  id="userHomeTitle" th:text="${c.title}"></span>
				        </div>
			        </a>
			      </div>
			    </div>
			  </div>
		 </div>
	 </div>
	 <div class="content">
	  <div id="userHomeHeader">Based on your favourite Cuisines:</div>
		  <div class="scrolling-wrapper-flexbox">
				<div class="cardInfo" th:each="c : ${cuisines}">
			    <div class="col s3">
			      <div style="border-radius:20px" class="card">
			        <a th:href="@{'/users/viewRecipe/' + ${c.id}}">
				         <div class="card-image">
				          	<img id="userHomeImage" style="border-radius:20px" th:if="${c.recipeImg != null}" th:src="@{'/images/recipes/'+ ${c.recipeImg}}">

							<img id="userHomeImage" style="border-radius:20px" th:unless="${c.recipeImg != null}" th:src="@{/images/shakshuka.png}">
				          <span class="card-title"  id="userHomeTitle" th:text="${c.title}"></span>
				        </div>
			        </a>
			      </div>
			    </div>
			  </div>
		 </div>
	 </div>
	 <div class="content">
	  <div id="userHomeHeader">Based on your favourite Proteins:</div>
		  <div class="scrolling-wrapper-flexbox">
				<div class="cardInfo" th:each="p : ${proteins}">
			    <div class="col s3">
			      <div style="border-radius:20px" class="card">
			        <a th:href="@{'/users/viewRecipe/' + ${p.id}}">
				         <div class="card-image">
				          	<img id="userHomeImage" style="border-radius:20px" th:if="${p.recipeImg != null}" th:src="@{'/images/recipes/'+ ${p.recipeImg}}">

							<img id="userHomeImage" style="border-radius:20px" th:unless="${p.recipeImg != null}" th:src="@{/images/shakshuka.png}">
				          <span class="card-title"  id="userHomeTitle" th:text="${p.title}"></span>
				        </div>
			        </a>
			      </div>
			    </div>
			  </div>
		 </div>
	 </div>
	 <div class="content">
	  <div id="userHomeHeader">Based on your favourite diet:</div>
		  <div class="scrolling-wrapper-flexbox">
				<div class="cardInfo" th:each="d : ${diets}">
			    <div class="col s3">
			      <div style="border-radius:20px" class="card">
			        <a th:href="@{'/users/viewRecipe/' + ${d.id}}">
				         <div class="card-image">
				          	<img id="userHomeImage" style="border-radius:20px" th:if="${d.recipeImg != null}" th:src="@{'/images/recipes/'+ ${d.recipeImg}}">

							<img id="userHomeImage" style="border-radius:20px" th:unless="${d.recipeImg != null}" th:src="@{/images/shakshuka.png}">
				          <span class="card-title"  id="userHomeTitle" th:text="${d.title}"></span>
				        </div>
			        </a>
			      </div>
			    </div>
			  </div>
		 </div>
	 </div>
</body>
</html>
