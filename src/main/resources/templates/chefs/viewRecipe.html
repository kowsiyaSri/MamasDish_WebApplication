<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="ISO-8859-1">
	<script type="text/javascript" src="https://code.jquery.com/jquery-2.1.1.min.js"></script>
    <link href="css/style.css" th:href="@{/css/style.css}" rel="stylesheet" type="text/css">
    <link href="css/nutritionFactTable.css" th:href="@{/css/nutritionFactTable.css}" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script type="text/javascript" src="../../js/nutrition.js"></script>
    <script src="../static/js/script.js" th:src="@{/js/script.js}"></script>
    	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta http-equiv="content-type" content="text/html; charset=UTF-8">

    <title>View Recipe</title>
</head>

<body>
	<div th:replace="fragments/myHeader :: headerTemplate"></div>

        <div class="container">
            <div class="row" >
                <div class="card" style="margin-top: 5%; border-radius: 15px">
                    <div class="card-image"><img id="recipeImg" style="height: 350px"
                            th:if="${recipe.recipeImg != null}"
                            th:src="@{'http://ocranp.dev.fast.sheridanc.on.ca/images/recipes/' + ${recipe.recipeImg}}">
                        <img id="recipeImg" th:unless="${recipe.recipeImg != null}" style="opacity: 0.6; height: 350px"
                            th:src="@{/images/shakshuka.png}">
                              <span class="card-title" id="recipeTitle" th:text="${recipe.title}">Card Title</span>
          					<a th:href="@{/users/deleteRecipe/{id}(id=${recipe.id})}" class="btn-floating halfway-fab waves-effect waves-light red"><i class="material-icons">delete</i></a>
                    </div>
                    
                    <div class="card-content">
                        <!-- Edit Recipe button only shown for chefs -->
                           
                            <span id="chefFont"
                                th:text="'Recipe By:  ' + ${recipe.chef.enduser.firstName} + ' ' + ${recipe.chef.enduser.lastName}"></span>
                            <span>
                                     <a class="btn-flat btn-medium waves-effect waves-light"  th:href="@{/users/editRecipePartOne/{id}(id=${recipe.id})}"><i class="material-icons blue-text">edit</i></a>
                    
                            </span>
                        </span>

                        <hr>
                        <div style="padding: 20px 0px">Course: <strong
                                th:text="${recipe.mealtype.mealName.toLowerCase()}">main</strong>
                            &nbsp&nbsp&nbsp&nbsp/&nbsp&nbsp&nbsp&nbsp Country:
                            <strong th:text="${recipe.country.name.toLowerCase()}">italian</strong>
                        </div>
                        <div style="margin-top: 5px; border: 1px dashed lightgrey; height: 100px;" class="row s12">
                            <div id="srvDiv" class="col s4 js-servingSize"><img class="icon"
                                    th:src="@{/images/serving.png}" id="center">
                                <p id="iconlbl">Serving Size:</p>
                                <p th:text="${recipe.servingSize}" th:attr="data-servingsize=${recipe.servingSize}">1
                                </p>
                            </div>
                            <div id="srvDiv" class="col s4"><img class="icon" th:src="@{/images/time.png}">
                                <p id="iconlbl">Prep Time:</p>
                                <p th:text="${#numbers.formatDecimal(recipe.prepTime, 0, 0)} + ' mins'">
                                    10 mins</p>
                            </div>
                            <div class="col s4" id="center" style="padding: 10px"><img class="icon"
                                    th:src="@{/images/cooking.png}" id="center">
                                <p id="iconlbl">Cook Time:</p>
                                <p th:text="${#numbers.formatDecimal(recipe.cookTime, 0, 0)} + ' mins'"></p>
                            </div>
                        </div>
                        
                        <div th:replace="fragments/myNutrition :: nutritionTemplate"></div>

                        <div class="yellow lighten-5">
                            <ul class="collection with-header js-ingredientList" id="centerUl"
                                style="border: 0px; width: 92%">
                                <li class="collection-header yellow lighten-5" id="ulHeader">
                                    <h6 id="listLbl">
                                        <strong>INGREDIENTS</strong>
                                    </h6>
                                </li>
                                <!-- If measurement type exists -->
                                <li th:each="r: ${recipe.ingredients}"
                                	th:if="${r.measurement}"
                                    th:attr="data-quantity=${r.quantity},data-type=${r.measurement.measurementType},data-name=${r.ingredient.ingredientName}"
                                    class="collection-item yellow lighten-5" style="padding: 20px 0px">
	                                <div id="ingredLi" th:text="${r.quantity} + ' ' + ${r.measurement.measurementType} + ' ' + ${r.ingredient.ingredientName}">
	                                </div>
                                </li>
                                <!-- If measurement type dosen't exist -->
                                <li th:each="r: ${recipe.ingredients}"
                                	th:unless="${r.measurement}"
                                    th:attr="data-quantity=${r.quantity},data-name=${r.ingredient.ingredientName}"
                                    class="collection-item yellow lighten-5" style="padding: 20px 0px">
	                                <div id="ingredLi" th:text="${r.quantity} + ' ' + ${r.ingredient.ingredientName}"></div>
                                </li>
                            </ul>
                        </div>
                        <div>
                            <ul class="collection with-header" style="border: 0px">

                                <li id="listLbl" class="collection-header">
                                    <h6 id="listLbl">
                                        <strong>INSTRUCTIONS</strong>
                                    </h6>
                                </li>

                                <li id="list" class="collection-item" style="padding: 20px 25px"
                                    th:each="i : ${instructions}">
                                    <div th:text="${i.stepNumber} + ') ' + ${i.description}"></div>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
</body>
</html>
