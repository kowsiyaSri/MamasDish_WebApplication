<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="ISO-8859-1">
<link href="css/home.css" th:href="@{/css/home.css}" rel="stylesheet" type="text/css">
<link href="css/home.css" th:href="@{/css/style.css}" rel="stylesheet" type="text/css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
<title>Welcome to Mama's Dish</title>
</head>
<body>
	<header>
		<div class="navbar-fixed" id="centerNav">
			<nav class="homeNav fixed" id="centerNav">
				<div class="nav-wrapper" id="centerNav">
					<!-- <a th:href="@{/}" class="brand-logo"><img class="logo"
					src="/images/logo.png" /></a> -->
					<ul style="width: 100%" id="centerNav"
						class="hide-on-med-and-down">
						<li style="padding-right: 70px"><a style="padding:0px 30px" th:href="@{/admin}"  id="homeNavTxt">Recipes</a></li>
					
					</ul>
				</div>
			</nav>
		</div>
	</header>
<body>

<div class="container" style="padding-top:10px">

 <div class="row">

<div th:each="r: ${recipes}">
    <div class="col s6">
      <div class="card">

        <div class="card-content">
        
          <span class="card-title" id="recipeCard"  th:text="${r.title}"></span>
		<p id="recipeDescription" style="text-align:left" th:text="${r.description}"></p>
		
        </div>
        <div class="card-action">
          <a th:href="@{/admin/authRecipe/{id}(id=${r.id})}">View Recipe Details</a>
        </div>
      </div>
            </a>
      
    </div>
    </div>
    </div>

</body>
</html>
