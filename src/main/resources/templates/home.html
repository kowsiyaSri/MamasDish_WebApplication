<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="ISO-8859-1">
<title>Insert title here</title>
</head>
<body>
<div th:each="r : ${recipes}">
	<div th:text="${r.title}"></div>
	<div th:each="i :${r.ingredients}">
		<div th:text="${i.ingredient.ingredient_name}"></div>
	</div>
		<div th:each="i :${r.instructions}">
		<div th:text="${i.stepNumber} + ') ' + ${i.description}"></div>
	</div>
</div>
</body>
</html>
