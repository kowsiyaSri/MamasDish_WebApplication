<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/thymeleaf-extra-springsecurity5">
<head>
	<meta charset="ISO-8859-1">
	<link href="css/home.css" th:href="@{/css/home.css}" rel="stylesheet" type="text/css">
	<link href="css/home.css" th:href="@{/css/style.css}" rel="stylesheet" type="text/css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
	<script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
	<script src="../static/js/script.js" th:src="@{/js/script.js}"></script>
	<title>View Saved Recipes</title>
</head>
<body>
	<header>
		<div class="navbar-fixed">
			<nav>
				<div class="nav-wrapper" style="background-color: white">
					<a th:href="@{/users/userHome}" class="brand-logo" style="color: grey; padding-left: 10px;">Mama's Dish</a> 
					<a href="#" data-target="mobile-demo" class="sidenav-trigger">
						<i class="material-icons cyan-text text-darken-4">menu</i>
					</a>
					<ul class="right hide-on-med-and-down">
						<li><a th:href="@{/users/viewAllRecipe}" id="homeNavTxt">
							All Recipes</a></li>
						<li><a th:href="@{/users/discover}" id="homeNavTxt">
							Discover Recipes</a></li>
						<li><a th:href="@{/chefs/chefIndex}" id="homeNavTxt">
							Chef's Portal</a></li>
						<li><a th:href="@{/chefs/uploadRecipe}" id="homeNavTxt">
							Upload Recipe</a></li>
						<li><a th:href="@{/viewProfile}" id="homeNavTxt">Profile</a></li>
						<li><a th:href="@{/messages/inbox}" id="homeNavTxt">Inbox
							<span class="new badge" th:text="${emails}" id="mailCount"></span></a></li>
						<li><a th:href="@{/logout}" id="homeNavTxt">Logout</a></li>
					</ul>
				</div>
			</nav>
		</div>
	</header>

	<div class="content">
		<h3 id="recipeHeader" style="font-size: 20px">Saved Recipes:</h3>

		<div class="row">
			<div th:if="${!user.recipe.empty and user.recipe !=null}">
				<div th:each="r: ${user.recipe}">
					<div class="col s4">
						<a class="link" th:href="@{/users/viewRecipe/{id}(id=${r.id})}">
							<div class="card" style="height: 300px; margin: 15px; border-radius: 15px;">
								<div class="card-image">
									<img id="recipeImg" th:if="${r.recipeImg != null}" th:src="@{'/images/recipes/' + ${r.recipeImg}}"> 
									<img id="recipeImg" th:unless="${r.recipeImg != null}" style="opacity: 0.6" th:src="@{/images/shakshuka.png}">
								</div>
								<div class="card-content">
									<span class="card-title" id="recipeCard" th:text="${r.title}"></span>
								</div>
							</div>
						</a>
					</div>
				</div>
			</div>

		</div>
	</div>
</body>
</html>
