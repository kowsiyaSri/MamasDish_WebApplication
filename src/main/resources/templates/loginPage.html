<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
<link href="http://fonts.googleapis.com/icon?family=Material+Icons"
	rel="stylesheet">
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/materialize/0.97.7/css/materialize.min.css">
<link rel="stylesheet"
	href="https://maxcdn.bootstrapcdn.com/font-awesome/4.6.1/css/font-awesome.min.css">
<link href='https://fonts.googleapis.com/css?family=Open+Sans:300'
	rel='stylesheet' type='text/css'>
<link href='css/style.css' rel='stylesheet' type='text/css'>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
<title>Account</title>
<style>
.tabs .indicator {
	background-color: #0d47a1;
}

body {
	align-items: center;
}
</style>
</head>
<body>


	<div class="row container padtop80" style="min-height: 100vh">
		<div class="col m6 offset-m3 s12">
			<div class="row">
				<div class="col s12">
					<ul class="tabs">
						<li class="tab col s3"><a href="#test1"
							class="active blue-text text-darken-4">Login</a></li>
					</ul>
				</div>
			</div>
		</div>
		<div id="test1" class="col s12 padtop40">
			<form th:action="@{/login}" method="post">

				<div class="col m6 offset-m3 s12 z-depth-1 padtop10 ">
					<div class="lid">
						<div th:if="${param.error}">
							<div class="alert ">Invalid username or password.</div>
						</div>
						<div th:if="${param.logout}">
							<div class="alert ">You have been logged out.</div>
						</div>
						<div class="input-field col s12 remx">
							<input placeholder="Placeholder" id="first_name" type="text"
								class="validate" name="username"> <label
								for="first_name">User Name/Email</label>
						</div>
						<div class="input-field col s12 remx">
							<input placeholder="Placeholder" id="password1" type="password"
								name="password" class="validate"> <label for="password1">Password</label>
						</div>
						<p class="padleft10 remx">
							<input type="checkbox" id="test5" /> <label for="test5">Remember
								Me</label>
						</p>
						<p class="padleft10 remx">
							<input type="submit" name="login-submit" id="login-submit"
								value="Login" class="blue darken-4 btn" style="margin:20px;">  <a th:href="@{/register}" class="blue-text text-darken-4" id="hider">Register</a>
			</form>	
		</div>





		<script type="text/javascript"
			src="https://code.jquery.com/jquery-2.1.1.min.js"></script>
		<script
			src="https://cdnjs.cloudflare.com/ajax/libs/materialize/0.97.8/js/materialize.min.js">
			
		</script>
		<script>
			$(document).ready(function() {
				$(".button-collapse").sideNav();
				$(".dropdown-button").dropdown();
				$('select').material_select();
				$('.slider').slider({
					full_width : true
				});
				$(".button-collapse").sideNav();
			})
		</script>
		<script>
			$(document).ready(function() {
				$(".hid").hide();
				$("#hider").click(function() {
					$(".remx").hide();
					$(".hid").show();
				});
				$("#cancll").click(function() {
					$(".remx").show();
					$(".hid").hide();
				})
			});
		</script>
</body>


</html>
