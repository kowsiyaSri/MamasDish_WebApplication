<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
<link href="http://fonts.googleapis.com/icon?family=Material+Icons"
	rel="stylesheet">
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/materialize/0.97.7/css/materialize.min.css">
<link rel="stylesheet"
	href="https://maxcdn.bootstrapcdn.com/font-awesome/4.6.1/css/font-awesome.min.css">
<link href='https://fonts.googleapis.com/css?family=Open+Sans:300'
	rel='stylesheet' type='text/css'>
<link href='css/style.css' rel='stylesheet' type='text/css'>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
<title>Account</title>
<style>
.tabs .indicator {
	background-color: #0d47a1;
}

body {
	align-items: center;
		align-items: center;
	 background-image: url('images/ingredient_op.png');
  	background-repeat: no-repeat;
  	background-attachment: fixed;  
  	background-size: cover;
	
}
</style>
</head>
<body>
<header>
		<div class="navbar-fixed" id="centerNav" >
			<nav style="height:160px; background-color:white;" class="fixed" id="centerNav">
				<div class="nav-wrapper" id="centerNav">
					<!-- <a th:href="@{/}" class="brand-logo"><img class="logo"
					src="/images/logo.png" /></a> -->
					<ul style="width: 100%" id="centerNav"
						class="hide-on-med-and-down">
						<li><a id="landNav" href="/users/userHome">Mama's Dish</a></li>
					
					</ul>
				</div>
			</nav>
		</div>
	</header>

	<div class="row container padtop80" style="margin-top:70px">
		<div class="col m6 offset-m3 s12">
			<div class="row">
				<div class="col s12">
					<ul class="tabs">
						<li class="tab col s3"><a href="#test1"
							class="active blue-text text-darken-4">Register</a></li>
					</ul>
				</div>
			</div>
		</div>
		<div class="col m6 offset-m3 s12 z-depth-1"  id="formLogin">
		<form th:action="@{/register}" method="post">
			
				<p id="errId" style="text-align:center" th:text="${errMssg}"></p>
			
				<div class="input-field col s12 ">
					<input placeholder="Email Address" th:value="${emailInput}" id="email" type="text" name="email" class="validate" required> 
						<label for="email">Email ID* </label>
				</div>
				<div class="input-field col s12 ">
					<input placeholder="First Name" id="first_name" th:value="${fNameInput}" type="text" name="fname" class="validate" required>
					 <label for="first_name">First Name* </label>
				</div>
				<div class="input-field col s12 ">
					<input placeholder="Last Name" id="last_name"  th:value="${lNameInput}"  type="text" name="lname" class="validate" required> 
					<label for="last_name">Last Name* </label>
				</div>
				<div class="input-field col s12 ">
					<input placeholder="Password" id="password1" type="password" required name="password" class="validate">
					<label for="password1">Password*</label>
				</div>
				
				<div class="input-field col s12 ">
					<input placeholder="Password" id="password2" type="password" required name="password2" class="validate"> 
					<label for="password2">Re-enter Password*</label>
				</div>
				<div class="input-field col s12 ">
					<label>Select Preferences:</label><br><br>
				</div>
				<div class="input-field col s12 ">
					<label>Country</label><br><br>
					<select class="browser-default" id="countryPref" name="countryPref">
						<option th:text="'No Preference'" value="" selected></option>
						<option th:each="c : ${countries}" th:value="${c.name}" th:text="${c.name}"></option>
					</select>
				</div>
	
				<div class="input-field col s12">
					<label>Cuisine</label><br><br>
					<select class="browser-default" id="cuisinePref" name="cuisinePref">
						<option th:text="'No Preference'" value="" selected></option>
						<option th:each="c : ${cuisines}" th:value="${c.cuisineName}" th:text="${c.cuisineName}"></option>
					</select>
				</div>
				
				<div class="input-field col s12">
					<label>Diet Type</label><br><br>
					<select class="browser-default" id="dietPref" name="dietPref">
						<option th:text="'No Preference'" value="" selected></option>
						<option th:each="d : ${diets}" th:value="${d.dietType}" th:text="${#strings.capitalize(#strings.toLowerCase(d.dietType))}"></option>
					</select>
				</div>
				
				<div class="input-field col s12">
					<label>Protein</label><br><br>
					<select class="browser-default" id="proteinPref" name="proteinPref">
						<option th:text="'No Preference'" value="" selected></option>
						<option th:each="p : ${proteins}" th:value="${p.proteinType}" th:text="${#strings.capitalize(#strings.toLowerCase(p.proteinType))}"></option>
					</select>
					<br>
				</div>


				<p style="padding-left:10px;">
					<input type="checkbox" name="isChef" id="test6" onClick="showDescription(this)" /> 
						<label for="test6">Sign up as a CHEF </label>
				</p>
				
				<div class="input-field col s12 " id="descriptionBox" style="display: none">
					<label>Tell us about yourself: </label>
					<textarea name="description"  class="materialize-textarea"></textarea>					
				</div>
				<p id="loginBtn" >
					<input type="submit" value="Register"  class="blue darken-4 btn"/>
				</p>
			
		</form>
		</div>
		</div>


		<script type="text/javascript"
			src="https://code.jquery.com/jquery-2.1.1.min.js"></script>
		<script
			src="https://cdnjs.cloudflare.com/ajax/libs/materialize/0.97.8/js/materialize.min.js">
			
		</script>
		<script>
			$(document).ready(function() {
				$(".button-collapse").sideNav();
				$(".dropdown-button").dropdown();
				$('select').material_select();
				$('.slider').slider({
					full_width : true
				});
				$(".button-collapse").sideNav();
			})
		</script>
		<script>
			$(document).ready(function() {
				$(".hid").hide();
				$("#hider").click(function() {
					$(".remx").hide();
					$(".hid").show();
				});
				$("#cancll").click(function() {
					$(".remx").show();
					$(".hid").hide();
				})
			});
			
			
			function showDescription(el) {
		       if (el.checked) {
					$("#descriptionBox").css("display", "block")
				}
				else{
					$("#descriptionBox").css("display", "none")
				}}
		</script>
</body>


</html>
