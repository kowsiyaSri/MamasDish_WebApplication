<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<script type="text/javascript" src = "https://code.jquery.com/jquery-2.1.1.min.js"></script>
<script src="../static/js/approval.js" th:src="@{/js/approval.js}"></script>
<meta charset="ISO-8859-1">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta charset="UTF-8">
<link href="css/style.css" th:href="@{/css/style.css}" rel="stylesheet">

<title>Awaiting Approval</title>

<link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
</head>
<body>
	<div class="w3-display-middle">
		<h1 class="w3-jumbo w3-animate-top w3-center"><code>Awaiting Approval</code></h1><br>
		<hr class="w3-border-white w3-animate-left" style="margin:auto;width:50%">
		<h3 class="w3-center w3-animate-right">Please allow 24-48 hours for Mama's Dish to approve your recipe.</h3><br>
		<h3 class="w3-center w3-animate-zoom">
			<a href="/chefs/chefIndex" class="w3-button w3-white w3-border w3-border-blue w3-round-large">View Your Recipes</a>
		</h3>
	</div>
	 <div th:each="i: ${ingredients}">
	 
	 <span id="chefFont" th:text="${i.ingredient.ingredientName}"></span> 
	 
	 </div>
	 
</body>
</html>
