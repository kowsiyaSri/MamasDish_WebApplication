<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="ISO-8859-1">
<script type="text/javascript" src="https://code.jquery.com/jquery-2.1.1.min.js"></script>
<link href="css/home.css" th:href="@{/css/home.css}" rel="stylesheet" type="text/css">
<link href="css/home.css" th:href="@{/css/style.css}" rel="stylesheet" type="text/css">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
<script src="../static/js/script.js" th:src="@{/js/script.js}"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
<title>Welcome to Mama's Dish</title>
</head>
<body>

	<div th:replace="fragments/myHeader :: headerTemplate"></div>
	
	<div class="content">
	  <div id="userHomeHeader"><a id="userHomeHeader" href="/users/suggest" th:href="@{/users/suggest}">Just for You</a></div>
		  <div class="scrolling-wrapper-flexbox">
				<div class="cardInfo" th:each="s : ${suggest}">
			    <div class="col s3">
			      <div style="border-radius:20px" class="card">
			        <a th:href="@{'/users/viewRecipe/' + ${s.id}}">
				         <div class="card-image">
				          	<img id="userHomeImage" style="border-radius:20px" th:if="${s.recipeImg != null}" th:src="@{'http://ocranp.dev.fast.sheridanc.on.ca/images/recipes/'+ ${s.recipeImg}}">

							<img id="userHomeImage" style="border-radius:20px" th:unless="${s.recipeImg != null}" th:src="@{/images/shakshuka.png}">
				          <span class="card-title"  id="userHomeTitle" th:text="${s.title}"></span>
				        </div>
			        </a>
			      </div>
			    </div>
			  </div>
		 </div>
	 </div>
	<div class="content">
	  <div id="userHomeHeader"><a href="/users/discover" id="userHomeHeader" th:href="@{/users/discover}">Discover Recipes By Country</a></div>
		  <div class="scrolling-wrapper-flexbox">
				<div class="cardInfo" th:each="c : ${countries}">
			    <div class="col s3">
			      <div style="border-radius:20px" class="card">
			        <a th:href="@{'/users/viewRecipesByCountry/' + ${c.name}}">
				         <div class="card-image">
				         <img id="userHomeImage"  style="border-radius:20px" th:src="'https://flagcdn.com/h120/'+ ${#strings.toLowerCase(c.countryCode)} +'.png'"  th:alt=${c.name}>
				          <span class="card-title"  id="userHomeTitle" th:text="${c.name}"></span>
				        </div>
			        </a>
			      </div>
			    </div>
			  </div>
		 </div>
	 </div>
	 <div class="content">
	  <div id="userHomeHeader">Discover Recipes By Diet</div>
		  <div class="scrolling-wrapper-flexbox">
				<div class="cardInfo" th:each="d : ${diets}">
			    <div class="col s3">
			      <div style="border-radius:20px" class="card">
			        <a th:href="@{'/users/viewByDiet/' + ${d.id}}">
				         <div class="card-image">
				          <img id="userHomeImage" style="border-radius:20px" th:src="@{'/images/diets/'+ ${d.dietType} +'.jpeg'}">
				          <span class="card-title"  id="userHomeTitle" th:text="${d.dietType}"></span>
				        </div>
			        </a>
			      </div>
			    </div>
			  </div>
		 </div>
	 </div>
	 <div class="content">
	  <div id="userHomeHeader">Discover Recipes By Meal Type</div>
		  <div class="scrolling-wrapper-flexbox">
				<div class="cardInfo" th:each="m : ${meals}">
			    <div class="col s3">
			      <div style="border-radius:20px" class="card">
			        <a th:href="@{'/users/viewByMeal/' + ${m.id}}">
				         <div class="card-image">
				          <img id="userHomeImage" style="border-radius:20px" th:src="@{'/images/mealtypes/' + ${m.mealName} + '.jpeg'}">
				          <span class="card-title"  id="userHomeTitle" th:text="${m.mealName}"></span>
				        </div>
			        </a>
			      </div>
			    </div>
			  </div>
		 </div>
	 </div>
</body>
</html>
