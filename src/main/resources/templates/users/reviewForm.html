<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="ISO-8859-1">
<link href="css/reviewForm.css" th:href="@{/css/reviewForm.css}" rel="stylesheet" type="text/css">
<title>Insert title here</title>
</head>
<body>
<div class="feedback">
<p>Dear Customer,<br><br>
Thank you for using Mama's Dish App. Please spare some moments to give us your valuable feedback.</p>
 
<h4>Please rate your experience for the following parameters</h4>
 
<form method="post" action="#" th:action="@{/viewRecipeAfterRating}">
<label> Your overall experience with this recipe ?</label><br>
  
<span class="star-rating">
  <input type="radio" name="rating" value="1" checked><i></i>
  <input type="radio" name="rating" value="2"><i></i>
  <input type="radio" name="rating" value="3"  ><i></i>
  <input type="radio" name="rating" value="4"><i></i>
  <input type="radio" name="rating" value="5"><i></i>
</span>
  
  <div class="clear"></div> 
  <hr class="survey-hr">
<input type="checkbox" name="anonymous" ><i></i>
<label> Review as anonymous</label><br><br/>
 
  <div class="clear"></div> 
  <hr class="survey-hr"> 
<label for="m_3189847521540640526commentText"> Add a written review:</label><br/><br/>
<textarea cols="75" name="commentText" rows="5" style="width:100%"></textarea><br>
<br>
  <div class="clear"></div> 
<input style="background:#43a7d5;color:#fff;padding:12px;border:0" type="submit" value="Submit your review"> 
 <input type="hidden" id="userId" name="userId" th:value="${userId}">
 <input type="hidden" id="recipeId" name="recipeId" th:value="${recipeId}">
</form>
</div>

</body>
</html>
