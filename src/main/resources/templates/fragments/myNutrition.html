<div th:fragment="nutritionTemplate">
	<ul class="collapsible expandable">
                            <li>
                                <div class="collapsible-header">Nutrition Facts</div>
                                <div class="collapsible-body">
                                    <section class="performance-facts" id="centerTable">
                                        <table class="performance-facts__table">
                                            <thead>
                                                <tr>
                                                    <th colspan="3" class="small-info">Amount Per Serving</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <tr>
                                                    <th colspan="2">
                                                        <b>Calories</b>
                                                        <span class="js-totalCalories"></span>
                                                    </th>
                                                </tr>
                                                <tr>
                                                    <th colspan="2">
                                                        <b>Total Fat</b>
                                                        <span class="js-totalFat"></span>g
                                                    </th>
                                                </tr>
                                                <tr>
                                                    <td class="blank-cell"></td>
                                                    <th>
                                                        Saturated Fat
                                                        <span class="js-totalSaturatedFat"></span>g
                                                    </th>
                                                </tr>
                                                <tr>
                                                    <th colspan="2">
                                                        <b>Cholesterol</b>
                                                        <span class="js-totalCholesterol"></span>mg
                                                </tr>
                                                <tr>
                                                    <th colspan="2">
                                                        <b>Sodium</b>
                                                        <span class="js-totalSodium"></span>mg
                                                    </th>
                                                </tr>
                                                <tr>
                                                    <th colspan="2">
                                                        <b>Total Carbohydrate</b>
                                                        <span class="js-totalCarbohydrate"></span>g
                                                    </th>
                                                </tr>
                                                <tr>
                                                    <td class="blank-cell"></td>
                                                    <th>
                                                        Dietary Fiber
                                                        <span class="js-totalDietaryFiber"></span>g
                                                    </th>
                                                </tr>
                                                <tr>
                                                    <td class="blank-cell"></td>
                                                    <th>
                                                        Sugars
                                                        <span class="js-totalSugars"></span>g
                                                    </th>
                                                </tr>
                                                <tr class="thick-end">
                                                    <th colspan="2">
                                                        <b>Protein</b>
                                                        <span class="js-totalProtein"></span>g
                                                    </th>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </section>
                                </div>
                            </li>
                        </ul>
</div>
